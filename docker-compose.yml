services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 160M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formatador
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-formatador}"
      POSTGRES_DB: formatador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formatador"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: formatador-api:latest
    environment:
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      # Link de doacao exibido no site (opcional)
      DOACOES_URL: ""
      # Doacao via PIX (opcional): QR + copia-e-cola
      PIX_CHAVE: "${PIX_CHAVE:-}"
      PIX_NOME: "${PIX_NOME:-}"
      PIX_CIDADE: "${PIX_CIDADE:-}"
      # Fase 2 — metricas/auditoria
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-troque-esta-chave}"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
      AUTO_CRIAR_TABELAS: "true"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      ALERTA_WEBHOOK_URL: "${ALERTA_WEBHOOK_URL:-}"
      FILA_HABILITADA: "true"
      REDIS_URL: "redis://redis:6379/0"
      FILA_MAX_JOBS: "20"
      JOBS_DIR: "/data/jobs"
      JOB_TTL_SEGUNDOS: "900"
      JOB_FILA_TTL_SEGUNDOS: "1800"
    volumes:
      - jobs-data:/data/jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: formatador-api:latest
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--serializer", "json", "--max-jobs", "100", "documentos"]
    environment:
      REDIS_URL: "redis://redis:6379/0"
      FILA_HABILITADA: "true"
      FILA_NOME: "documentos"
      JOBS_DIR: "/data/jobs"
      JOB_TTL_SEGUNDOS: "900"
      JOB_FILA_TTL_SEGUNDOS: "1800"
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
    volumes:
      - jobs-data:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; Redis.from_url('redis://redis:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: formatador-web:latest
    environment:
      API_HOST: "api"
      API_PORT: "8000"
    depends_on:
      - api
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  jobs-data:
