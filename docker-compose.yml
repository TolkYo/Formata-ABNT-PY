services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formatador
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-formatador}"
      POSTGRES_DB: formatador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formatador"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: formatador-api:latest
    environment:
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      # Link de doacao exibido no site (opcional)
      DOACOES_URL: ""
      # Fase 2 — metricas/auditoria
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-troque-esta-chave}"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
      AUTO_CRIAR_TABELAS: "true"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      ALERTA_WEBHOOK_URL: "${ALERTA_WEBHOOK_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: formatador-web:latest
    environment:
      API_HOST: "api"
      API_PORT: "8000"
    depends_on:
      - api
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
