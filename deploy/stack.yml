# Stack de produção para Docker Swarm + Traefik (Fase 1).
#
# Pré-requisitos na VPS:
#   1) docker swarm init
#   2) docker network create --driver overlay --attachable traefik-public
#   3) Build das imagens (na raiz do projeto):
#        docker compose build
#   4) cp deploy/.env.example deploy/.env  e edite DOMAIN/ACME_EMAIL
#   5) cd deploy && docker stack deploy -c stack.yml formatador
#
# Observação: `docker stack deploy` NÃO constrói imagens; por isso o passo 3.

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M

  api:
    image: formatador-api:latest
    environment:
      QUOTA_ANONIMA_DIA: "3"
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  web:
    image: formatador-web:latest
    environment:
      API_HOST: "formatador_api"
      API_PORT: "8000"
    networks:
      - traefik-public
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.formatador.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.formatador.entrypoints=websecure
        - traefik.http.routers.formatador.tls.certresolver=letsencrypt
        - traefik.http.services.formatador.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay

volumes:
  letsencrypt:
