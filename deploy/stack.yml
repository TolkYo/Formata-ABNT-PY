# Stack Swarm — aplicação + Postgres.
#
# A borda (80/443 + TLS do Certbot) é o **nginx do host**, que faz proxy para
# http://127.0.0.1:8080 (serviço `web` publicado neste stack). Não há Traefik.
#
# Pré-requisitos na VPS:
#   1) docker swarm init
#   2) Build das imagens (na raiz do projeto):  docker compose build
#   3) Variáveis:  cd deploy && cp .env.example .env  (edite) ; set -a; . ./.env; set +a
#   4) docker stack deploy -c stack.yml formatador
#
# Variáveis usadas: POSTGRES_PASSWORD, ADMIN_API_KEY, IP_HASH_SALT, DOACOES_URL,
# PIX_CHAVE, PIX_NOME, PIX_CIDADE, SENTRY_DSN, SENTRY_ENVIRONMENT,
# SENTRY_TRACES_SAMPLE_RATE, ALERTA_WEBHOOK_URL.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 160M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formatador
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-formatador}"
      POSTGRES_DB: formatador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  api:
    image: formatador-api:latest
    environment:
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      DOACOES_URL: "${DOACOES_URL:-}"
      PIX_CHAVE: "${PIX_CHAVE:-}"
      PIX_NOME: "${PIX_NOME:-}"
      PIX_CIDADE: "${PIX_CIDADE:-}"
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-troque-esta-chave}"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
      AUTO_CRIAR_TABELAS: "true"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      ALERTA_WEBHOOK_URL: "${ALERTA_WEBHOOK_URL:-}"
      FILA_HABILITADA: "true"
      REDIS_URL: "redis://redis:6379/0"
      FILA_NOME: "documentos"
      FILA_MAX_JOBS: "20"
      JOBS_DIR: "/data/jobs"
      JOB_TIMEOUT_SEGUNDOS: "180"
      JOB_TTL_SEGUNDOS: "900"
      JOB_FILA_TTL_SEGUNDOS: "1800"
    volumes:
      - jobs-data:/data/jobs
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  worker:
    image: formatador-api:latest
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--serializer", "json", "--max-jobs", "100", "documentos"]
    environment:
      REDIS_URL: "redis://redis:6379/0"
      FILA_HABILITADA: "true"
      FILA_NOME: "documentos"
      JOBS_DIR: "/data/jobs"
      JOB_TTL_SEGUNDOS: "900"
      JOB_FILA_TTL_SEGUNDOS: "1800"
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
    volumes:
      - jobs-data:/data/jobs
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; Redis.from_url('redis://redis:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  web:
    image: formatador-web:latest
    environment:
      API_HOST: "api"
      API_PORT: "8000"
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: host
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M

networks:
  internal:
    driver: overlay

volumes:
  postgres-data:
  redis-data:
  jobs-data:
