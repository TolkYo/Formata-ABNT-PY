# Stack HTTP (sem domínio) — Fase 1, acesso por http://SEU-IP
#
# Pré-requisitos na VPS:
#   1) docker swarm init
#   2) docker network create --driver overlay --attachable traefik-public
#   3) Build das imagens (na raiz do projeto):  docker compose build
#   4) cd deploy && docker stack deploy -c stack.yml formatador
#
# Quando tiver um domínio, use o arquivo stack-tls.yml (HTTPS + Let's Encrypt).

services:
  traefik:
    image: traefik:v3.7
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M

  api:
    image: formatador-api:latest
    environment:
      QUOTA_ANONIMA_DIA: "3"
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  web:
    image: formatador-web:latest
    environment:
      API_HOST: "formatador_api"
      API_PORT: "8000"
    networks:
      - traefik-public
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.formatador.rule=PathPrefix(`/`)
        - traefik.http.routers.formatador.entrypoints=web
        - traefik.http.services.formatador.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay
