# Stack HTTP (sem domínio) — Fase 1/2, acesso por http://SEU-IP
#
# Pré-requisitos na VPS:
#   1) docker swarm init
#   2) docker network create --driver overlay --attachable traefik-public
#   3) Build das imagens (na raiz do projeto):  docker compose build
#   4) cd deploy && docker stack deploy -c stack.yml formatador
#
# Variáveis opcionais (exporte antes do deploy): POSTGRES_PASSWORD, ADMIN_API_KEY,
# IP_HASH_SALT, DOACOES_URL.
#
# Quando tiver um domínio, use o arquivo stack-tls.yml (HTTPS + Let's Encrypt).

services:
  traefik:
    image: traefik:v3.7
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formatador
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-formatador}"
      POSTGRES_DB: formatador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  api:
    image: formatador-api:latest
    environment:
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      DOACOES_URL: "${DOACOES_URL:-}"
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-troque-esta-chave}"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
      AUTO_CRIAR_TABELAS: "true"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      ALERTA_WEBHOOK_URL: "${ALERTA_WEBHOOK_URL:-}"
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  web:
    image: formatador-web:latest
    environment:
      API_HOST: "formatador_api"
      API_PORT: "8000"
    networks:
      - traefik-public
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.formatador.rule=PathPrefix(`/`)
        - traefik.http.routers.formatador.entrypoints=web
        - traefik.http.services.formatador.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay

volumes:
  postgres-data:
