# Stack HTTPS (com domínio) — Fase 1/2, acesso por https://SEU-DOMINIO
#
# Use quando tiver um domínio apontando (registro A) para o IP da VPS.
# Sem domínio, use stack.yml (HTTP).
#
# Passos:
#   1) docker swarm init
#   2) docker network create --driver overlay --attachable traefik-public
#   3) docker compose build   (na raiz do projeto)
#   4) cp .env.example .env  e edite DOMAIN/ACME_EMAIL/POSTGRES_PASSWORD/ADMIN_API_KEY
#   5) docker stack deploy -c stack-tls.yml formatador
#
# Variáveis: DOMAIN, ACME_EMAIL, POSTGRES_PASSWORD, ADMIN_API_KEY, IP_HASH_SALT, DOACOES_URL.

services:
  traefik:
    image: traefik:v3.7
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formatador
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-formatador}"
      POSTGRES_DB: formatador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  api:
    image: formatador-api:latest
    environment:
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: "*"
      DOACOES_URL: "${DOACOES_URL:-}"
      DATABASE_URL: "postgresql+psycopg://formatador:${POSTGRES_PASSWORD:-formatador}@postgres:5432/formatador"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-troque-esta-chave}"
      IP_HASH_SALT: "${IP_HASH_SALT:-troque-este-sal}"
      AUTO_CRIAR_TABELAS: "true"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
      ALERTA_WEBHOOK_URL: "${ALERTA_WEBHOOK_URL:-}"
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  web:
    image: formatador-web:latest
    environment:
      API_HOST: "formatador_api"
      API_PORT: "8000"
    networks:
      - traefik-public
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.formatador.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.formatador.entrypoints=websecure
        - traefik.http.routers.formatador.tls.certresolver=letsencrypt
        - traefik.http.services.formatador.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay

volumes:
  letsencrypt:
  postgres-data:
